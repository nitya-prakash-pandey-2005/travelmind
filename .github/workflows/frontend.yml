name: frontend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    # Build only (no push): the web image (SPA + unprivileged nginx) used by
    # deploy/docker-compose.yml.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: travelmind-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          # The post-job cache prune exits non-zero here and fails an otherwise green run.
          enable-cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare database and reference data
        working-directory: backend
        env:
          PGPASSWORD: postgres
        run: |
          uv sync --locked
          psql -h localhost -p 5433 -U postgres -f ../infra/postgres/init.sql
          uv run python -m alembic upgrade head
          uv run python -m travelmind.reference.cli import-ourairports \
            --airports-file tests/reference/fixtures/airports.csv \
            --countries-file tests/reference/fixtures/countries.csv
      - name: Start the API
        working-directory: backend
        env:
          TM_FX_ENABLED: "false"
          TM_SIGNUP_MAX_PER_IP: "1000"  # every e2e test signs up a new agency from one IP
        run: |
          nohup uv run python -m uvicorn travelmind.main:create_app --factory --port 8010 > ../api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8010/health && break; sleep 1; done
      - name: Run Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-debug
          path: |
            frontend/playwright-report
            api.log
