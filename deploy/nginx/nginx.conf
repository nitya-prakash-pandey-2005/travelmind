# TravelMind edge: serves the built SPA and proxies the API to the gunicorn replicas.
# Mounted read-only by deploy/docker-compose.yml; the image (frontend/Dockerfile) holds the SPA.
# Rate limiting stays in the app (per IP, per user, per link), which sees the real client address
# because this file overwrites X-Forwarded-For (see proxy.conf).
# Runs as nginx-unprivileged (uid 101, no capabilities): port 8080, pid and temp files in /tmp.

worker_processes auto;
worker_rlimit_nofile 16384;
pid /tmp/nginx.pid;
# warn and above, for upstream diagnostics (connect/timeouts). An error-log line carries the
# request line, so the two locations whose URL holds a share token (/q/, /api/v1/public/quotes/)
# send their error log to /dev/null instead (see below and deploy/README.md).
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/xml image/svg+xml font/ttf;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Behind a load balancer or CDN, $remote_addr is the balancer's address, so every visitor
    # would share one set of per-IP limits. Uncomment, and list only the balancer's own addresses
    # (never 0.0.0.0/0: anyone could then pick their IP). nginx then takes the client address
    # from the balancer's X-Forwarded-For, and proxy.conf forwards that address to the app.
    # set_real_ip_from 10.0.0.0/8;       # the load balancer's subnet
    # set_real_ip_from 2001:db8::/32;    # and its IPv6 range, if any
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;              # skip every trusted hop, take the first untrusted one

    # Share tokens are bearer secrets: never write them to the access log. The token locations
    # set $token_path; it is matched on the location (after nginx decodes and normalises the
    # path), so /api/v1/public/%71uotes/... or //q/... is masked too.
    map $token_path $log_uri {
        ""      $request_uri;
        default $token_path;
    }
    log_format edge '$remote_addr [$time_local] "$request_method $log_uri $server_protocol" '
                    '$status $body_bytes_sent $request_time $upstream_response_time '
                    '"$http_user_agent"';
    access_log /dev/stdout edge;

    # The API sets Referrer-Policy: no-referrer on public quote responses; keep theirs, else ours.
    map $upstream_http_referrer_policy $api_referrer_policy {
        ""      "strict-origin-when-cross-origin";
        default "";
    }

    # Docker's embedded DNS: re-resolve `api` so scaled or restarted replicas are picked up.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream api {
        zone api 64k;
        server api:8000 resolve;
        keepalive 64;
        keepalive_timeout 4s; # below gunicorn's keepalive (5 s): nginx closes idle sockets first
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        set $token_path "";

        # API and liveness.
        location /api/ {
            include /etc/nginx/travelmind/proxy.conf;
            include /etc/nginx/travelmind/security_headers.conf;
            add_header Referrer-Policy $api_referrer_policy always;
        }
        # Public quote API: the token is in the path, so no error log and a masked access log.
        location /api/v1/public/quotes/ {
            set $token_path "/api/v1/public/quotes/<token>";
            error_log /dev/null;
            include /etc/nginx/travelmind/proxy.conf;
            include /etc/nginx/travelmind/security_headers.conf;
            add_header Referrer-Policy $api_referrer_policy always;
        }
        location = /health {
            include /etc/nginx/travelmind/proxy.conf;
            include /etc/nginx/travelmind/security_headers.conf;
            add_header Referrer-Policy $api_referrer_policy always;
        }

        # Readiness for an outside load balancer: the status code and a bare body only. The api's
        # JSON (which dependency is down) stays inside the network; the compose healthcheck calls
        # the api's /ready directly. auth_request runs the real check first: a 2xx falls through
        # to @ready_ok (try_files never finds its first, made-up file), anything else becomes 503.
        location = /ready {
            auth_request /_ready_upstream;
            error_page 500 = @not_ready;
            try_files /.no-such-file @ready_ok;
        }
        location = /_ready_upstream {
            internal;
            proxy_pass http://api/ready;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
        }
        location @ready_ok {
            include /etc/nginx/travelmind/security_headers.conf;
            add_header Cache-Control "no-store" always;
            default_type text/plain;
            return 200 "ok\n";
        }
        location @not_ready {
            include /etc/nginx/travelmind/security_headers.conf;
            add_header Cache-Control "no-store" always;
            default_type text/plain;
            return 503 "not ready\n";
        }

        # Metrics are scraped inside the network (api:8000/metrics with TM_METRICS_TOKEN), never here.
        location = /metrics {
            return 404;
        }

        # Hashed build output: cache forever.
        location /assets/ {
            include /etc/nginx/travelmind/security_headers.conf;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # Client quote links (/q/<token>): the SPA, kept out of search engines, and the token in
        # the URL is never sent on as a Referer. index.html is served here directly (not via an
        # internal redirect), so these headers stay on the response.
        location /q/ {
            set $token_path "/q/<token>";
            error_log /dev/null;
            include /etc/nginx/travelmind/security_headers.conf;
            add_header X-Robots-Tag "noindex, nofollow" always;
            add_header Referrer-Policy no-referrer always;
            add_header Cache-Control "no-cache" always;
            try_files /index.html =404;
        }

        # Everything else: a real file, or the SPA shell for client-side routes. Revalidated on
        # every load so a deploy is picked up at once.
        location / {
            include /etc/nginx/travelmind/security_headers.conf;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Cache-Control "no-cache" always;
            try_files $uri /index.html =404;
        }
    }
}
