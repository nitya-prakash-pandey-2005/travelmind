# Proxy to the api upstream (included by the API locations in nginx.conf).
proxy_pass http://api;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# Overwrite, never append: whatever X-Forwarded-For the client sent is dropped, so the app (which
# trusts this header from nginx, see backend/gunicorn.conf.py) keys its per-IP limits on the
# address that actually connected to nginx. Behind a load balancer, enable the real_ip block in
# nginx.conf so that $remote_addr is the visitor's address, not the balancer's.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Real-IP $remote_addr;
proxy_connect_timeout 5s;
proxy_read_timeout 60s; # searches can take up to 25 s
proxy_send_timeout 60s;
