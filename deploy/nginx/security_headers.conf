# Response security headers. nginx drops server-level add_header lines in any location that has
# its own, so every location includes this file and then adds its Referrer-Policy.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
