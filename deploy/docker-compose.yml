# Production-like TravelMind stack (local). See deploy/README.md.
#   cp deploy/.env.example deploy/.env      # then change the passwords
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#   bash deploy/smoke.sh
# Low-memory machine: build the two images one at a time first (`... build api`, then
# `... build nginx`) and start without --build. See deploy/README.md.
# Topology: nginx (:8080 on the host) -> api (gunicorn + uvicorn workers, N replicas)
#           -> pgbouncer (transaction pooling) -> postgres; redis; arq worker; one-shot migrate.
# Only nginx publishes a port. Every secret comes from deploy/.env (git-ignored).
name: travelmind-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# For containers that run as a non-root user from the start and bind no port below 1024
# (api, worker, migrate, pgbouncer, nginx): no Linux capabilities, no privilege gain through
# setuid binaries. Postgres and Redis keep Docker's defaults: their entrypoints start as root to
# chown the data directory, then switch user.
x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

# Settings shared by the api and the worker. Keys without a value are passed through from
# deploy/.env (or the shell) only when set there, so the app's own defaults apply otherwise.
x-app-env: &app-env
  TM_ENVIRONMENT: production
  TM_DATABASE_URL: postgresql+asyncpg://travelmind_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in deploy/.env}@pgbouncer:5432/travelmind
  TM_DB_PGBOUNCER: "true"
  TM_REDIS_URL: redis://redis:6379/0
  TM_RUN_SCHEDULER: "false" # the worker owns the periodic jobs
  # Plain HTTP on localhost only. Set true (and serve HTTPS in front of nginx) anywhere else.
  TM_COOKIE_SECURE: "false"
  TM_ALLOWED_ORIGINS: '["http://localhost:8080"]'
  TM_LOG_LEVEL: ${TM_LOG_LEVEL:-INFO}
  TM_METRICS_TOKEN: ${TM_METRICS_TOKEN:-}
  TM_SANDBOX_SUPPLIER: ${TM_SANDBOX_SUPPLIER:-}
  TM_DUFFEL_TOKEN: ${TM_DUFFEL_TOKEN:-}
  TM_LITEAPI_KEY: ${TM_LITEAPI_KEY:-}
  TM_GOOGLE_TIM_API_KEY: ${TM_GOOGLE_TIM_API_KEY:-}
  TM_TRAVELPAYOUTS_TOKEN: ${TM_TRAVELPAYOUTS_TOKEN:-}
  TM_FX_ENABLED: ${TM_FX_ENABLED:-true}
  # Optional overrides (pool sizes, rate limits; deploy/.env.loadtest raises the per-IP limits).
  TM_DB_POOL_SIZE:
  TM_DB_MAX_OVERFLOW:
  TM_LOGIN_MAX_ATTEMPTS:
  TM_LOGIN_IP_MAX_ATTEMPTS:
  TM_LOGIN_WINDOW_SECONDS:
  TM_SIGNUP_MAX_PER_IP:
  TM_SIGNUP_WINDOW_SECONDS:
  TM_DEMO_MAX_PER_IP:
  TM_DEMO_WINDOW_SECONDS:
  TM_SEARCH_MAX_PER_MINUTE:
  TM_REPRICE_MAX_PER_MINUTE:
  TM_PUBLIC_QUOTE_MAX_PER_MINUTE:

services:
  postgres:
    image: pgvector/pgvector:pg16
    # Sized for a laptop that runs the whole stack (deploy/README.md, "Postgres settings").
    # work_mem is per sort or hash step; PgBouncer holds at most DEFAULT_POOL_SIZE (40) server
    # connections for the app, so 40 x 8 MB bounds the usual worst case. pg_stat_statements is
    # preloaded here and created by init.sql (on an older volume, create it by hand: README).
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-256MB}
      - -c
      - work_mem=${PG_WORK_MEM:-8MB}
      - -c
      - shared_preload_libraries=pg_stat_statements
    # Parallel query workers share memory through /dev/shm (Docker's default is 64 MB).
    shm_size: 256mb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      # Read by init.sql (\getenv) when the volume is first created. It fails if either is unset.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in deploy/.env}
      OWNER_DB_PASSWORD: ${OWNER_DB_PASSWORD:?set OWNER_DB_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      # TCP, not the socket: during first-run init the server listens on the socket only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d travelmind"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *logging

  pgbouncer:
    image: edoburu/pgbouncer:v1.26.0-p0
    <<: *hardening
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: travelmind
      DB_USER: travelmind_app
      DB_PASSWORD: ${APP_DB_PASSWORD}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "2000"
      DEFAULT_POOL_SIZE: "40"
      # A client that waits this long for a server connection gets an error, instead of queueing
      # for the default 120 s. The app's own pool gives up after 5 s anyway.
      QUERY_WAIT_TIMEOUT: "10"
      # Read-only console user for SHOW POOLS / SHOW STATS on the `pgbouncer` db. It exists only
      # in PgBouncer's userlist, not in Postgres. There is no admin user: admin_users keeps the
      # image default `postgres`, which has no userlist entry, so nobody can PAUSE, RELOAD or
      # SHUTDOWN through the console. The owner role is not in the userlist at all.
      STATS_USERS: travelmind_stats
      PGBOUNCER_STATS_PASSWORD: ${PGBOUNCER_STATS_PASSWORD:?set PGBOUNCER_STATS_PASSWORD in deploy/.env}
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
    # The image's entrypoint appends the app user to userlist.txt; the stats user is written first.
    entrypoint:
      - /bin/sh
      - -c
      - |
        printf '"travelmind_stats" "%s"\n' "$$PGBOUNCER_STATS_PASSWORD" > /etc/pgbouncer/userlist.txt
        exec /entrypoint.sh /usr/bin/pgbouncer /etc/pgbouncer/pgbouncer.ini
    ulimits:
      nofile: { soft: 8192, hard: 8192 }
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5432"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7-alpine
    # Only keys with a TTL are evicted: cache entries go first; per-agency cache versions,
    # rate-limit windows and the job queue stay.
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *logging

  # One-shot: schema migrations as the owner role, straight to postgres (DDL does not go through
  # PgBouncer). The api and the worker start only after it exits 0.
  migrate:
    # The api service is the only one that builds this image, so `up --build` builds it once
    # (not three times in parallel). `never`: use the local build, don't try a registry.
    image: travelmind-prod/api:local
    pull_policy: never
    <<: *hardening
    command: ["alembic", "upgrade", "head"]
    environment:
      TM_MIGRATION_DATABASE_URL: postgresql+asyncpg://travelmind_owner:${OWNER_DB_PASSWORD}@postgres:5432/travelmind
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *logging

  api:
    build:
      context: ../backend
    image: travelmind-prod/api:local
    <<: *hardening
    environment:
      <<: *app-env
      PROMETHEUS_MULTIPROC_DIR: /tmp/prom
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-}
    deploy:
      replicas: ${API_REPLICAS:-2}
    stop_grace_period: 25s # gunicorn graceful_timeout is 20 s
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # The real /ready (database and Redis), inside the container. Through nginx, /ready only
      # answers a bare status (deploy/nginx/nginx.conf).
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    logging: *logging

  # arq: periodic jobs (demo cleanup, quote expiry) and queued work. It exits quickly when Redis
  # is unreachable (conn_retries=1), so it starts after a healthy Redis and is restarted.
  worker:
    image: travelmind-prod/api:local # built by the api service
    pull_policy: never
    <<: *hardening
    command: ["arq", "travelmind.worker.WorkerSettings"]
    environment:
      <<: *app-env
    stop_grace_period: 25s
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  # nginx-unprivileged (frontend/Dockerfile): runs as uid 101 and listens on 8080 inside the
  # container, so it needs no capabilities at all.
  nginx:
    build:
      context: ../frontend
    image: travelmind-prod/web:local
    <<: *hardening
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy.conf:/etc/nginx/travelmind/proxy.conf:ro
      - ./nginx/security_headers.conf:/etc/nginx/travelmind/security_headers.conf:ro
    ulimits:
      nofile: { soft: 16384, hard: 16384 }
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  redisdata:
